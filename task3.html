<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve a table - Task 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm p-4">
                    <h2 class="mb-4 text-center fw-bold">Reserve a table</h2>
                    
                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label">Your name</label>
                            <input type="text" class="form-control" id="name" placeholder="Your name" required>
                        </div>

                        <div class="mb-3">
                            <label for="email-cafe" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email-cafe" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" placeholder="+7..." required>
                        </div>

                        <div class="mb-3">
                            <label for="guests" class="form-label">Guests</label>
                            <input type="number" class="form-control" id="guests" min="1" max="20" value="2" required>
                        </div>

                        <div class="mb-3">
                            <label for="date" class="form-label">Date</label>
                            <input type="date" class="form-control" id="date" required>
                        </div>

                        <fieldset class="mb-3">
                            <legend class="col-form-label pt-0">Seating:</legend>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="seating" id="inside" value="Inside" checked>
                                <label class="form-check-label" for="inside">Inside</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="seating" id="terrace" value="Terrace">
                                <label class="form-check-label" for="terrace">Terrace</label>
                            </div>
                        </fieldset>

                        <div class="mb-3">
                            <label for="meal" class="form-label">Meal type</label>
                            <select class="form-select" id="meal" required>
                                <option value="" selected disabled>Choose meal...</option>
                                <option value="Lunch">Lunch</option>
                                <option value="Dinner">Dinner</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="comments" class="form-label">Comments</label>
                            <textarea class="form-control" id="comments" rows="3" placeholder="Comments"></textarea>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="terms" required>
                            <label class="form-check-label" for="terms">I agree to the terms</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Reserve</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
